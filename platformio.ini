; PlatformIO Project Configuration for EmbeddedDataConvert

[platformio]
default_envs = native_test

[env:native_test]
platform = native
build_flags =
    -std=c99
    -Iinclude
    -Itests/unity
    -Wall
    -Wextra

[env:stm32f407]
platform = ststm32
board = discovery_f407vg
framework = stm32cube
build_flags =
    -std=c99
    -Iinclude
    -O2

[env:esp32]
platform = espressif32
board = esp32dev
framework = espidf
build_flags =
    -std=c99
    -Iinclude
    -O2
